<style>
html,body{margin:0;background:#140F33}
*{box-sizing:border-box}
/* Ночной заезд: тёмная пиксельная «игра», закатные акценты; на ПК меню сверху, на телефоне снизу. Дневная тема позже. */
:root{
  --bg:#140F33; --bg2:#22174A; --bg3:#341A55;
  --panel:#1F1846; --panel2:#271E57; --line:#4B3A8F; --shadow:#0B0820;
  --ink:#FFEFE0; --muted:#A99BD6; --dim:#8f84b8;
  --pink:#FF5FA2; --orange:#FF9F43; --cyan:#4FD1E8; --yellow:#FFD166; --violet:#B58CFF; --green:#7BE08A; --sky:#6EC1F5;
  --on:#140F33; --topbg:rgba(20,15,51,.94); --tsh:#140F33;
  --font:Handjet, "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:500 20px/1.25 var(--font);letter-spacing:.01em;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--topbg);border-bottom:3px solid var(--line);backdrop-filter:blur(6px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top-in{max-width:1240px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:20px}
.me{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.ava{width:56px;height:56px;flex:none;position:relative;overflow:hidden;background:linear-gradient(180deg,#3B2A8C,#FF5FA2 90%);border:3px solid var(--pink);box-shadow:3px 3px 0 var(--shadow)}
.ava img{position:absolute;width:68px;max-width:none;left:50%;transform:translateX(-50%);top:2px}
.me-txt{display:flex;flex-direction:column;gap:4px;width:170px}
.me-name{font-weight:800;font-size:22px;display:flex;justify-content:space-between}
.me-name b{color:var(--pink)}
.bar{height:12px;background:#2E2463;border:2px solid var(--line);display:block;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--orange))}
.me-xp{font-size:15px;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a,.more-btn{color:var(--ink);text-decoration:none;font-size:21px;padding:6px 10px;border:0;background:none}
.nav a:hover,.more-btn:hover{color:var(--yellow)}
.nav a.on{color:var(--yellow)}
.nav a.on::before{content:"▶ "}
.chips{margin-left:auto;display:flex;gap:8px}
.chip{font-weight:700;font-size:18px;padding:6px 10px;border:3px solid currentColor;white-space:nowrap}
.more{position:relative}
.more-menu{position:absolute;right:0;top:44px;background:var(--panel);border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow);display:flex;flex-direction:column;min-width:200px;padding:6px;z-index:30}
.more-menu a{color:var(--ink);text-decoration:none;padding:8px 10px;font-size:20px}
.more-menu a:hover,.more-menu a.on{background:var(--panel2);color:var(--yellow)}

/* нижнее меню телефона */
.bnav{display:none}
.task{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.task.held{outline:3px solid var(--yellow);outline-offset:-3px}
.ghost-drag{position:fixed;z-index:60;pointer-events:none;outline:3px solid var(--yellow);opacity:.95;margin:0}
.dgrp{display:flex;flex-direction:column;gap:8px;padding:4px;margin:0 -4px}
.task.ins{box-shadow:0 -5px 0 var(--yellow)}.dgrp.ins-end{box-shadow:inset 0 -5px 0 var(--yellow)}
.rvg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.rv{background:var(--panel2);border:2px solid var(--line);padding:8px 10px;display:flex;flex-direction:column}.rv b{font-size:28px;font-variant-numeric:tabular-nums}.rv span{color:var(--muted);font-size:16px}
.dgrp.over{outline:3px dashed var(--yellow);background:rgba(255,209,102,.08)}
.tedit{position:fixed;inset:0;z-index:50;background:rgba(11,8,32,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.tedit[hidden]{display:none}
.tedit-in{background:var(--panel);border:3px solid var(--pink);box-shadow:6px 6px 0 #0b0820;padding:16px;width:min(460px,100%);display:grid;gap:10px;max-height:calc(100vh - 32px);overflow:auto}
.tedit-in h3{margin:0;font-size:26px}
.tedit-in label{font-size:16px;color:var(--muted)}
.tedit-in .seg{display:flex;gap:4px}.tedit-in .seg button{flex:1 1 0;min-width:0;padding-left:2px;padding-right:2px}.tedit-in{overflow-x:hidden}.tedit-in>.inp,.tedit-in .row .inp{width:100%;min-width:0;box-sizing:border-box}.tedit-in textarea.inp{font:inherit;resize:vertical}
.tedit-in .row{flex-wrap:wrap}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(11,8,32,.7);display:flex;align-items:flex-end}
.sheet-in{width:100%;background:var(--panel);border-top:3px solid var(--pink);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sheet-in a{color:var(--ink);text-decoration:none;padding:12px;background:var(--panel2);border:2px solid var(--line);font-size:21px}

/* обложка раздела */
.cover{position:relative;overflow:hidden;margin-top:24px;border:3px solid var(--line);box-shadow:0 0 0 3px var(--bg),6px 6px 0 3px var(--shadow);background:linear-gradient(180deg,#3B2A8C 0%,#8E3FA8 38%,var(--pink) 62%,var(--orange) 80%);min-height:250px;display:flex}
.cover .sun{position:absolute;right:16%;top:46px;width:210px;height:210px;border-radius:50%;background:repeating-linear-gradient(180deg,var(--yellow) 0 15px,#FF7A59 15px 20px)}
.cover .ground{position:absolute;left:0;right:0;bottom:0;height:64px;background:#1A1240;overflow:hidden}
.cover .ground::after{content:"";position:absolute;left:-50%;right:-50%;top:0;bottom:-40px;transform:perspective(200px) rotateX(55deg);transform-origin:top;background:repeating-linear-gradient(90deg,transparent 0 58px,var(--pink) 58px 61px),repeating-linear-gradient(180deg,transparent 0 22px,var(--pink) 22px 25px)}
.cover .palm{position:absolute;bottom:62px;fill:#1A1240}
.cover-txt{position:relative;z-index:2;padding:26px 30px 86px;display:flex;flex-direction:column;gap:10px;max-width:640px}
.eyebrow{font-weight:700;font-size:18px;color:var(--yellow);letter-spacing:.04em}
.cover h1{font-size:64px;line-height:.95;color:#fff;text-shadow:4px 4px 0 var(--tsh)}
.cover p{margin:0;font-size:21px;color:#fff;text-shadow:2px 2px 0 rgba(20,15,51,.6)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.stat{background:rgba(20,15,51,.85);border:3px solid var(--yellow);padding:6px 12px;min-width:96px}
.stat b{display:block;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:16px;color:var(--muted)}

/* сетка и панели */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;margin-top:28px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.pn{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--bg),6px 6px 0 3px var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pt{display:flex;align-items:baseline;gap:10px;font-weight:800;font-size:25px}
.pt small{margin-left:auto;font-weight:500;font-size:17px;color:var(--muted)}
.c-pink{color:var(--pink)}.c-cyan{color:var(--cyan)}.c-yellow{color:var(--yellow)}.c-orange{color:var(--orange)}.c-violet{color:var(--violet)}.c-green{color:var(--green)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.task{display:flex;align-items:center;gap:12px;padding:8px 10px;background:var(--panel2);font-size:20px}
.task.main{outline:3px solid var(--yellow)}
.task .t{flex:1;min-width:0}
.tact{display:flex;align-items:center;gap:8px;flex:none}
.hform .inp:first-child{flex:1 1 100%}
@media (max-width:820px){.tform .inp:first-child{flex:1 1 100%}.tform .inp{flex:1 1 auto}.bnav a,.bnav button{white-space:nowrap}
.li{flex-wrap:wrap;row-gap:6px}.li .t{flex:1 1 55%}.li .tag{white-space:normal}
form.row{flex-wrap:wrap}form.row:has(.inp + .inp) .inp:first-child{flex:1 1 100%}form.row:has(.inp + .inp) .inp,form.row:has(.inp + .inp) select{flex:1 1 auto;min-width:0}}
.hform select{flex:1 1 auto}
.mgrid td.n,.mgrid th.nh{position:sticky;left:0;z-index:2;background:var(--panel);box-shadow:4px 0 0 var(--panel)}
.mgrid th.today{color:var(--yellow)}
.task.done .t{text-decoration:line-through;color:var(--dim)}
.ck{width:24px;height:24px;border:3px solid var(--sky);background:transparent;flex:none;padding:0}
.ck.on{background:var(--sky);box-shadow:inset 0 0 0 3px var(--panel2)}
.xp{font-weight:700;font-size:17px;color:var(--yellow);white-space:nowrap}
.mini{border:2px solid var(--line);background:none;color:var(--muted);font-size:16px;padding:2px 8px}
.mini:hover{color:var(--ink);border-color:var(--muted)}
.grp{font-weight:700;font-size:17px;color:var(--muted);margin-top:6px}
.btn{font-weight:800;font-size:19px;border:3px solid var(--bg);box-shadow:3px 3px 0 var(--shadow);padding:8px 16px;color:var(--on);background:var(--yellow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.b-cyan{background:var(--cyan)}.b-pink{background:var(--pink)}.b-orange{background:var(--orange)}.b-ghost{background:var(--panel2);color:var(--ink);border-color:var(--line)}.b-green{background:var(--green)}
.inp{background:var(--panel2);border:2px solid var(--line);padding:8px 10px;font-size:20px;min-width:0;flex:1}
.inp::placeholder{color:var(--dim)}
select.inp{flex:none}
.nums{display:flex;gap:6px}
.num{width:40px;height:40px;border:2px solid var(--line);background:var(--panel2);font-weight:800;font-size:20px}
.num.on{background:var(--pink);color:var(--on);border-color:var(--pink)}
.num.on.c2{background:var(--cyan);border-color:var(--cyan)}
.hgrid{display:grid;gap:8px;align-items:center}
.hb{width:26px;height:26px;border:3px solid var(--sky);background:transparent;padding:0}
.hb.on{background:var(--sky);box-shadow:inset 0 0 0 3px var(--panel)}
.hb.today{border-color:var(--yellow)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal div{height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:var(--panel2);color:var(--dim);font-variant-numeric:tabular-nums}
.cal .full{background:var(--pink);color:var(--on)}
.cal .part{background:#5B3A8F;color:var(--ink)}
.cal .today{background:var(--yellow);color:var(--on)}
.cal .wd{background:none;color:var(--muted);font-size:14px;height:20px}
.cal .empty{background:none}
.big{font-weight:800;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:3px 3px 0 var(--shadow)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:3px solid var(--line);background:var(--panel2);padding:6px 12px;font-size:19px;font-weight:700}
.tab.on{background:var(--cyan);color:var(--on);border-color:var(--on)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);font-size:19px}
.li .t{flex:1 1 9em;min-width:0;overflow-wrap:anywhere}.li{flex-wrap:wrap}.task .t{overflow-wrap:anywhere}
.tag{font-size:15px;font-weight:700;padding:1px 8px;border:2px solid currentColor;white-space:nowrap}
.sb{display:grid;grid-template-columns:130px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:19px}
.sb .bar i{background:var(--c,var(--cyan))}
.toast .undo{margin-left:10px;font:inherit;font-weight:800;background:var(--on);color:var(--yellow);border:0;padding:4px 10px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yellow);color:var(--on);font-weight:800;font-size:20px;padding:10px 18px;border:3px solid var(--bg);box-shadow:4px 4px 0 var(--shadow);z-index:50}
.word{font-weight:800;font-size:44px;line-height:1}
.hl{background:rgba(255,95,162,.25);border-bottom:2px solid var(--pink);cursor:pointer}
.known{color:var(--ink)}
.gap{width:110px;background:var(--panel2);border:0;border-bottom:3px solid var(--cyan);padding:0 4px;font-size:20px}
.gap.ok{border-color:var(--green);color:var(--green)}.gap.bad{border-color:var(--pink);color:var(--pink)}
.textbox{font-size:21px;line-height:1.55;max-width:70ch}
.card3d{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--panel2);border:3px dashed var(--line);text-align:center;padding:20px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:17px;padding:12px 6px;background:var(--panel2);border:2px solid var(--line)}
.badge b{font-size:28px}
.badge.lock{opacity:.45}
.hero-pic{position:relative;height:540px;overflow:hidden;background:linear-gradient(180deg,#3B2A8C 0%,#8E3FA8 40%,var(--pink) 66%,var(--orange) 82%);border-bottom:3px solid var(--line)}
.hero-pic .sun{position:absolute;left:50%;top:120px;width:250px;height:250px;margin-left:-125px;border-radius:50%;background:repeating-linear-gradient(180deg,var(--yellow) 0 16px,#FF7A59 16px 21px)}
.hero-pic .gr{position:absolute;left:0;right:0;bottom:0;height:70px;background:#1A1240}
.hero-pic img{position:absolute;left:50%;bottom:34px;height:440px;width:auto;max-width:none;transform:translateX(-50%)}
.foot{margin-top:40px;font-size:16px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.run .road{position:relative;height:58px;margin:6px 0 2px;border-bottom:4px dashed var(--line);background:linear-gradient(180deg,transparent 0 70%,rgba(255,95,162,.12) 70%)}
.run .road i{position:absolute;left:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--pink),var(--orange))}
.run .car{position:absolute;bottom:2px;transition:left .5s steps(8)}
.run .flag{position:absolute;right:0;bottom:2px}
.tm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--cyan);font-size:18px;min-width:46px}
.tomato{width:16px;height:16px;border:3px solid var(--pink);display:inline-block}
.tomato.on{background:var(--pink)}
.shop{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;gap:24px}
.wishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wish{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border:2px solid var(--line);padding:12px}

@media (max-width:760px){.fwrap{flex-wrap:wrap}.fwrap .inp{flex:1 1 40%!important;width:auto!important}.shop{grid-template-columns:1fr}.dep{grid-template-columns:1fr 1fr;padding:8px;background:var(--panel2)}.dep.head{display:none}.dep .mini{justify-self:end}}
.wk .task .tm{font-size:15px;min-width:0}
.wk .task .xp{display:none}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}

.ach.on{opacity:1;border-color:var(--yellow);box-shadow:3px 3px 0 var(--shadow)}
.ach .ai{flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);font-size:20px;color:var(--muted)}
.ach.on .ai{color:var(--yellow);border-color:var(--yellow)}
.ach .at .bar{width:100%}
.ach .at{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:18px}
.ach .ar{flex:none;font-weight:700;color:var(--yellow);font-size:17px}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

V.money=function(){
  var M=S.money;var pct=pctOf(M.saved,M.goal);
  var months=Object.keys(FIN).filter(function(k){return /^\d{4}-\d{2}$/.test(k);}).sort().reverse();
  if(!FINM||months.indexOf(FINM)<0)FINM=months[0]||null;
  var F_=FINM?FIN[FINM]:null;
  var tx=(F_&&Array.isArray(F_.tx))?F_.tx:[];
  var spend=tx.filter(function(x){return +x.a<0;});
  var incomeTx=tx.filter(function(x){return +x.a>0;});
  var tot=spend.reduce(function(a,x){return a-(+x.a);},0);
  var inc=incomeTx.reduce(function(a,x){return a+(+x.a);},0);
  var byc={};spend.forEach(function(x){var c=CATC[x.c]?x.c:'Другое';byc[c]=(byc[c]||0)-(+x.a);});
  var cats=Object.keys(byc).sort(function(a,b){return byc[b]-byc[a];});
  var mx=cats.length?byc[cats[0]]:1;

  var head=cover('Деньги на мечту','Финансы','Присылай выписки из банка в чат, я сам разнесу траты по категориям и в конце месяца напишу отчёт.',
    [[pct+'%','копилка США'],[F_?money(tot):'—','потрачено'+(FINM?' за '+monthName(FINM).toLowerCase():'')],[money(M.inc.reduce(function(a,d){return a+(+d.a||0);},0)+M.extra.filter(function(x){return String(x.d).slice(0,7)===TD.slice(0,7);}).reduce(function(a,x){return a+(+x.a||0);},0)),'доход за месяц'],[money(M.dep.reduce(function(a,d){return a+(+d.a||0);},0)),'на вкладах']]);
  var savings=pn('s12','Копилка на переезд','c-green',money(M.saved)+' из '+money(M.goal),'<span class="bar" style="height:22px"><i style="width:'+pct+'%;background:linear-gradient(90deg,var(--green),var(--cyan))"></i></span><label class="row" style="gap:8px;font-size:19px">Цель копилки, ₽'+fld('money.goal',M.goal||'',{num:1,label:'Цель копилки, ₽',ph:'например 1 500 000',st:'flex:none;width:170px'})+'</label><form class="row" data-f="addSave"><input class="inp" id="sv" type="number" min="1" placeholder="Сколько отложил, ₽" required><button class="btn b-cyan">Отложить +XP</button></form>');
  if(FTAB!=='spend')return head+'<div class="grid">'+finTabs()+finExtra()+savings+'</div>';
  if(!months.length){
    return head+'<div class="grid">'+finTabs()+
      pn('s12','Как это работает','c-yellow',null,
        '<div class="list">'+
        '<div class="li"><b class="c-yellow">1</b><span class="t">Выгрузи выписку из банковского приложения за месяц: файл CSV, Excel или PDF, можно и скриншоты.</span></div>'+
        '<div class="li"><b class="c-yellow">2</b><span class="t">Пришли её мне в чат и напиши «занеси в финансы».</span></div>'+
        '<div class="li"><b class="c-yellow">3</b><span class="t">Я разнесу каждую трату по категориям, и здесь появятся графики и список.</span></div>'+
        '<div class="li"><b class="c-yellow">4</b><span class="t">В конце месяца напишу отчёт: куда уходит больше всего и что можно улучшить.</span></div>'+
        '</div><div class="muted" style="font-size:17px">'+(finLoaded||!DB?'Выписок пока нет.':'Загружаю данные…')+'</div>')+
      savings+'</div>';
  }
  var sel='<div class="s12 tabs">'+months.map(function(m){return '<button class="tab'+(m===FINM?' on':'')+'" data-a="finMonth" data-m="'+m+'">'+monthName(m)+'</button>';}).join('')+'</div>';
  var bars=cats.map(function(c){return '<div class="sb" style="grid-template-columns:150px minmax(0,1fr) 100px;--c:'+CATC[c]+'"><span>'+esc(c)+'</span><span class="bar"><i style="width:'+Math.max(2,Math.round(byc[c]/mx*100))+'%"></i></span><span style="text-align:right;font-variant-numeric:tabular-nums">'+money(byc[c])+'</span></div>';}).join('')||'<div class="muted">Трат нет</div>';
  var share=cats.slice(0,4).map(function(c){return '<span class="tag" style="color:'+CATC[c]+'">'+esc(c)+' '+Math.round(byc[c]/Math.max(1,tot)*100)+'%</span>';}).join(' ');
  var list=tx.slice().sort(function(a,b){return String(b.d).localeCompare(String(a.d));}).slice(0,40).map(function(x){var neg=+x.a<0;return '<div class="li"><span class="muted" style="font-size:16px;width:52px;font-variant-numeric:tabular-nums">'+esc(String(x.d||'').slice(8,10)+'.'+String(x.d||'').slice(5,7))+'</span><span class="t">'+esc(x.t)+'</span><span class="tag" style="color:'+(CATC[x.c]||'#8f84b8')+'">'+esc(x.c||'Другое')+'</span><b style="font-variant-numeric:tabular-nums;color:'+(neg?'var(--ink)':'var(--green)')+'">'+(neg?'−':'+')+money(Math.abs(+x.a))+'</b></div>';}).join('');
  var report=rep?
    '<div style="font-size:21px;max-width:75ch">'+esc(rep.summary||'')+'</div>'+

    :'<div class="muted">Отчёт появится, когда месяц закончится и ты пришлёшь все выписки. Напиши в чат «сделай отчёт по финансам».</div>';
  return head+'<div class="grid">'+finTabs()+sel+
    pn('s7','По категориям','c-orange',money(tot),bars+'<div class="row" style="margin-top:4px">'+share+'</div>')+
    pn('s5','Отчёт месяца','c-yellow',rep?'готов':'в конце месяца',report)+
    pn('s12','Операции','c-pink',tx.length+' шт.'+(F_&&F_.source?' · '+esc(F_.source):''),'<div class="list">'+list+'</div>'+(tx.length>40?'<div class="muted" style="font-size:16px">Показаны последние 40</div>':''))+
    savings+'</div>';

  if(el.dataset&&el.dataset.p){if(el.dataset.p==='stars.rate'&&S.stars.rate<1)S.stars.rate=1;save();render();return;}
  if(el.dataset&&el.dataset.r){save();if(el.dataset.r==='book'&&+el.value===100)toast('100%! Нажми «Дочитал», чтобы получить XP');return;}
  if(el.dataset&&el.dataset.up==='restore'&&el.files&&el.files[0]){var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(!(d.state&&d.state.tasks)&&d.finance&&typeof d.finance==='object'){Object.keys(d.finance).forEach(function(k){FIN[k]=d.finance[k];if(USER)kvPut('finance:'+k,d.finance[k]);});FINM=null;render();toast('Финансы загружены');return;}if(!d.state||!d.state.tasks)throw 0;S=d.state;migrate();dayReset();if(d.finance&&typeof d.finance==='object'){FIN=d.finance;if(USER)Object.keys(d.finance).forEach(function(k){kvPut('finance:'+k,d.finance[k]);});}save();render();toast('Данные восстановлены из копии');}catch(er){toast('Это не файл копии кабинета');}};fr.readAsText(el.files[0]);return;}
  if(el.dataset&&el.dataset.up==='book'&&el.files&&el.files[0]&&ASSETS){var i=+el.dataset.i;toast('Загружаю обложку…');ASSETS.upload(el.files[0]).then(function(a){if(S.books.now[i]){S.books.now[i].img=a.url;save();render();toast('Обложка добавлена');}},function(){toast('Не удалось загрузить обложку');});}
});
document.getElementById('meBtn').addEventListener('click',function(){location.hash='hero';});
var mb=document.getElementById('moreBtn'),mm=document.getElementById('moreMenu');
mb.addEventListener('click',function(e){e.stopPropagation();mm.hidden=!mm.hidden;mb.setAttribute('aria-expanded',String(!mm.hidden));});
document.addEventListener('click',function(e){if(!mm.hidden&&!mm.contains(e.target)&&e.target!==mb){mm.hidden=true;mb.setAttribute('aria-expanded','false');}});
document.getElementById('sheet').addEventListener('click',function(e){if(e.target.id==='sheet'||e.target.closest('a'))document.getElementById('sheet').hidden=true;});
window.addEventListener('hashchange',function(){mm.hidden=true;render();window.scrollTo(0,0);});
render();initCloud();
})();
</script>
