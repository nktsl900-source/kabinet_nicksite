  --font:Handjet, "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:500 20px/1.25 var(--font);letter-spacing:.01em;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;min-height:100%}

button{cursor:pointer}

h1,h2,h3{margin:0;font-weight:800;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--topbg);border-bottom:3px solid var(--line);backdrop-filter:blur(6px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top-in{max-width:1240px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:20px}
.me{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.ava{width:56px;height:56px;flex:none;position:relative;overflow:hidden;background:linear-gradient(180deg,#3B2A8C,#FF5FA2 90%);border:3px solid var(--pink);box-shadow:3px 3px 0 var(--shadow)}

.me-xp{font-size:15px;color:var(--muted)}

/* нижнее меню телефона */

.cover .ground::after{content:"";position:absolute;left:-50%;right:-50%;top:0;bottom:-40px;transform:perspective(200px) rotateX(55deg);transform-origin:top;background:repeating-linear-gradient(90deg,transparent 0 58px,var(--pink) 58px 61px),repeating-linear-gradient(180deg,transparent 0 22px,var(--pink) 22px 25px)}

.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}

.stat span{font-size:16px;color:var(--muted)}

/* сетка и панели */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;margin-top:28px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.pn{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--bg),6px 6px 0 3px var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pt{display:flex;align-items:baseline;gap:10px;font-weight:800;font-size:25px}
.pt small{margin-left:auto;font-weight:500;font-size:17px;color:var(--muted)}
.c-pink{color:var(--pink)}.c-cyan{color:var(--cyan)}.c-yellow{color:var(--yellow)}.c-orange{color:var(--orange)}.c-violet{color:var(--violet)}.c-green{color:var(--green)}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.task{display:flex;align-items:center;gap:12px;padding:8px 10px;background:var(--panel2);font-size:20px}

@media (max-width:820px){.tform .inp:first-child{flex:1 1 100%}.tform .inp{flex:1 1 auto}.bnav a,.bnav button{white-space:nowrap}
.li{flex-wrap:wrap;row-gap:6px}.li .t{flex:1 1 55%}.li .tag{white-space:normal}
form.row{flex-wrap:wrap}form.row:has(.inp + .inp) .inp:first-child{flex:1 1 100%}form.row:has(.inp + .inp) .inp,form.row:has(.inp + .inp) select{flex:1 1 auto;min-width:0}}
.hform select{flex:1 1 auto}

.b-cyan{background:var(--cyan)}.b-pink{background:var(--pink)}.b-orange{background:var(--orange)}.b-ghost{background:var(--panel2);color:var(--ink);border-color:var(--line)}.b-green{background:var(--green)}
.inp{background:var(--panel2);border:2px solid var(--line);padding:8px 10px;font-size:20px;min-width:0;flex:1}

function tone(f,dur,when){var c=ac();if(!c)return;var t=c.currentTime+.02+(when||0);[[1,'triangle',.3],[2,'sine',.1],[3,'sine',.04]].forEach(function(h){var o=c.createOscillator(),g=c.createGain();o.type=h[1];o.frequency.value=f*h[0];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(h[2],t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.05);});}
function mf(m){return 440*Math.pow(2,(m-69)/12);}

var LESSONS=[
 {id:'keys',t:'Клавиши и названия нот',th:'<p>На клавиатуре чёрные клавиши стоят группами по 2 и по 3. Нота <b>до (C)</b> — белая клавиша сразу слева от группы из двух чёрных.</p><p>Дальше по белым клавишам вправо: <b>ре (D), ми (E), фа (F), соль (G), ля (A), си (B)</b>, и снова до. Семь нот от до до си называются <b>октавой</b>. В музыке на английском ноты называют буквами, поэтому учим оба названия.</p>',
  gen:function(){if(Math.random()<.55){var m=pick([60,62,64,65,67,69,71,72,74,76,77,79,81,83]);var l=SEMI.indexOf(m%12);var hl={};hl[m]='#FFD166';return {html:'<div class="qt">Как называется жёлтая клавиша?</div>'+kbSvg(hl),opts:RUN.map(function(r,i){return LAT[i]+' · '+r;}),a:l,snd:[m]};}

 {id:'ear',t:'Слух: выше или ниже',th:'<p>Чем правее клавиша, тем выше звук. Чем левее, тем ниже. Это первый навык слуха: понимать направление мелодии.</p><p>Послушай две ноты подряд и ответь, вторая выше или ниже первой. Можно переслушивать сколько угодно.</p>',
  gen:function(){var a=rnd(55,79),d=rnd(1,7)*(Math.random()<.5?-1:1);return {html:'<div class="qt">Вторая нота выше или ниже первой?</div>',opts:['Выше','Ниже'],a:d>0?0:1,play:function(){playSeq([a,a+d],.8);},auto:1};}},
 {id:'treble',t:'Скрипичный ключ',th:'<p>Ноты записывают на <b>нотном стане</b> из 5 линеек, считаем снизу. Скрипичный ключ 𝄞 закручивается вокруг 2-й линейки, на ней стоит нота <b>соль (G)</b>.</p><p>Ноты на линейках снизу вверх: <b>ми, соль, си, ре, фа</b> (E G B D F). Между линейками: <b>фа, ля, до, ми</b> (F A C E, по-английски складывается слово FACE). <b>До первой октавы</b> пишется на маленькой добавочной линейке под станом.</p><p>Правой рукой на фортепиано чаще всего играют именно в скрипичном ключе.</p>',

 {id:'read',t:'С нот на клавиши',th:'<p>Соединяем стан и клавиатуру. <b>C4</b> (до первой октавы) — это до ближе к центру пианино, обычно под названием инструмента. <b>C5</b> (до второй октавы) — следующая до правее.</p><p>Посмотри на ноту и нажми именно ту клавишу, в нужной октаве. На клавиатуре внизу подписаны все до.</p>',

 {id:'dur',t:'Длительности нот',th:'<p>Длительность показывает, сколько тянуть ноту. Считаем в <b>долях</b> (ударах):</p><p><b>Целая</b> — пустая головка без штиля, 4 доли. <b>Половинная</b> — пустая со штилем, 2 доли. <b>Четвертная</b> — закрашенная со штилем, 1 доля. <b>Восьмая</b> — с одним флажком, 1/2 доли. <b>Шестнадцатая</b> — с двумя флажками, 1/4 доли.</p><p>Каждый следующий флажок делит ноту пополам.</p>',

 {id:'meter',t:'Размер и такт',th:'<p>В начале нот пишут <b>размер</b>, похожий на дробь. <b>4/4</b>: в каждом такте 4 четверти. <b>3/4</b>: 3 четверти (так звучит вальс). <b>2/4</b>: 2 четверти (марш).</p><p>Такты разделяет вертикальная <b>тактовая черта</b>. Сумма длительностей в такте всегда равна размеру. Например в 4/4: половинная (2) + четвертная (1) + четвертная (1) = 4.</p>',

 {id:'acc',t:'Диезы, бемоли, тон и полутон',th:'<p>Соседние клавиши, включая чёрные, отличаются на <b>полутон</b>. Два полутона — это <b>тон</b>. Между <b>ми–фа</b> и <b>си–до</b> чёрной клавиши нет, поэтому там полутон.</p><p><b>Диез ♯</b> повышает ноту на полутон, <b>бемоль ♭</b> понижает. Чёрная клавиша между до и ре — это и до-диез (C♯), и ре-бемоль (D♭). <b>Бекар ♮</b> отменяет диез или бемоль.</p>',

 {id:'intear',t:'Интервалы на слух',th:'<p>Интервалы легче узнавать по знакомым песням:</p><p><b>Большая секунда</b> — «Happy Birthday» (на словах «py» → «birth»). <b>Большая терция</b> — светлое, мажорное начало. <b>Малая терция</b> — грустное, минорное. <b>Чистая кварта</b> — «Here Comes the Bride». <b>Чистая квинта</b> — «Twinkle, Twinkle, Little Star» (между первым и вторым «twinkle»). <b>Октава</b> — «Somewhere Over the Rainbow» (первые два звука).</p>',

var CATC={'Вклады':'#7BE08A','Продукты':'var(--green)','Кафе и доставка':'var(--orange)','Транспорт':'var(--cyan)','Дом и связь':'var(--sky)','Здоровье':'#F28DC0','Обучение':'var(--violet)','Подписки':'var(--pink)','Одежда':'var(--yellow)','Развлечения':'#FF7A59','Переводы':'#8f84b8','Другое':'#6b6290'};
var FINM=null;
function monthName(id){var p=id.split('-');return MONTHS1[+p[1]-1]+' '+p[0];}
V.money=function(){
  var M=S.money;var pct=pctOf(M.saved,M.goal);
  var months=Object.keys(FIN).filter(function(k){return /^\d{4}-\d{2}$/.test(k);}).sort().reverse();
  if(!FINM||months.indexOf(FINM)<0)FINM=months[0]||null;
  var F_=FINM?FIN[FINM]:null;
  var tx=(F_&&Array.isArray(F_.tx))?F_.tx:[];
  var spend=tx.filter(function(x){return +x.a<0;});
  var incomeTx=tx.filter(function(x){return +x.a>0;});
  var tot=spend.reduce(function(a,x){return a-(+x.a);},0);
  var inc=incomeTx.reduce(function(a,x){return a+(+x.a);},0);
  var byc={};spend.forEach(function(x){var c=CATC[x.c]?x.c:'Другое';byc[c]=(byc[c]||0)-(+x.a);});
  var cats=Object.keys(byc).sort(function(a,b){return byc[b]-byc[a];});
  var mx=cats.length?byc[cats[0]]:1;
  var rep=F_&&F_.report;
  var head=cover('Деньги на мечту','Финансы','Присылай выписки из банка в чат, я сам разнесу траты по категориям и в конце месяца напишу отчёт.',
    [[pct+'%','копилка США'],[F_?money(tot):'—','потрачено'+(FINM?' за '+monthName(FINM).toLowerCase():'')],[money(M.inc.reduce(function(a,d){return a+(+d.a||0);},0)+M.extra.filter(function(x){return String(x.d).slice(0,7)===TD.slice(0,7);}).reduce(function(a,x){return a+(+x.a||0);},0)),'доход за месяц'],[money(M.dep.reduce(function(a,d){return a+(+d.a||0);},0)),'на вкладах']]);
  var savings=pn('s12','Копилка на переезд','c-green',money(M.saved)+' из '+money(M.goal),'<span class="bar" style="height:22px"><i style="width:'+pct+'%;background:linear-gradient(90deg,var(--green),var(--cyan))"></i></span><label class="row" style="gap:8px;font-size:19px">Цель копилки, ₽'+fld('money.goal',M.goal||'',{num:1,label:'Цель копилки, ₽',ph:'например 1 500 000',st:'flex:none;width:170px'})+'</label><form class="row" data-f="addSave"><input class="inp" id="sv" type="number" min="1" placeholder="Сколько отложил, ₽" required><button class="btn b-cyan">Отложить +XP</button></form>');
  if(FTAB!=='spend')return head+'<div class="grid">'+finTabs()+finExtra()+savings+'</div>';
  if(!months.length){
    return head+'<div class="grid">'+finTabs()+
      pn('s12','Как это работает','c-yellow',null,
        '<div class="list">'+
        '<div class="li"><b class="c-yellow">1</b><span class="t">Выгрузи выписку из банковского приложения за месяц: файл CSV, Excel или PDF, можно и скриншоты.</span></div>'+
        '<div class="li"><b class="c-yellow">2</b><span class="t">Пришли её мне в чат и напиши «занеси в финансы».</span></div>'+
        '<div class="li"><b class="c-yellow">3</b><span class="t">Я разнесу каждую трату по категориям, и здесь появятся графики и список.</span></div>'+
        '<div class="li"><b class="c-yellow">4</b><span class="t">В конце месяца напишу отчёт: куда уходит больше всего и что можно улучшить.</span></div>'+
        '</div><div class="muted" style="font-size:17px">'+(finLoaded||!DB?'Выписок пока нет.':'Загружаю данные…')+'</div>')+
      savings+'</div>';
  }
  var sel='<div class="s12 tabs">'+months.map(function(m){return '<button class="tab'+(m===FINM?' on':'')+'" data-a="finMonth" data-m="'+m+'">'+monthName(m)+'</button>';}).join('')+'</div>';
  var bars=cats.map(function(c){return '<div class="sb" style="grid-template-columns:150px minmax(0,1fr) 100px;--c:'+CATC[c]+'"><span>'+esc(c)+'</span><span class="bar"><i style="width:'+Math.max(2,Math.round(byc[c]/mx*100))+'%"></i></span><span style="text-align:right;font-variant-numeric:tabular-nums">'+money(byc[c])+'</span></div>';}).join('')||'<div class="muted">Трат нет</div>';
  var share=cats.slice(0,4).map(function(c){return '<span class="tag" style="color:'+CATC[c]+'">'+esc(c)+' '+Math.round(byc[c]/Math.max(1,tot)*100)+'%</span>';}).join(' ');
  var list=tx.slice().sort(function(a,b){return String(b.d).localeCompare(String(a.d));}).slice(0,40).map(function(x){var neg=+x.a<0;return '<div class="li"><span class="muted" style="font-size:16px;width:52px;font-variant-numeric:tabular-nums">'+esc(String(x.d||'').slice(8,10)+'.'+String(x.d||'').slice(5,7))+'</span><span class="t">'+esc(x.t)+'</span><span class="tag" style="color:'+(CATC[x.c]||'#8f84b8')+'">'+esc(x.c||'Другое')+'</span><b style="font-variant-numeric:tabular-nums;color:'+(neg?'var(--ink)':'var(--green)')+'">'+(neg?'−':'+')+money(Math.abs(+x.a))+'</b></div>';}).join('');
  var report=rep?
    '<div style="font-size:21px;max-width:75ch">'+esc(rep.summary||'')+'</div>'+
    (rep.watch&&rep.watch.length?'<div class="grp">На что обратить внимание</div><div class="list">'+rep.watch.map(function(w){return '<div class="li"><span class="c-pink">!</span><span class="t">'+esc(w)+'</span></div>';}).join('')+'</div>':'')+
    (rep.tips&&rep.tips.length?'<div class="grp">Советы на следующий месяц</div><div class="list">'+rep.tips.map(function(w){return '<div class="li"><span class="c-green">+</span><span class="t">'+esc(w)+'</span></div>';}).join('')+'</div>':'')
    :'<div class="muted">Отчёт появится, когда месяц закончится и ты пришлёшь все выписки. Напиши в чат «сделай отчёт по финансам».</div>';
  return head+'<div class="grid">'+finTabs()+sel+
    pn('s7','По категориям','c-orange',money(tot),bars+'<div class="row" style="margin-top:4px">'+share+'</div>')+
    pn('s5','Отчёт месяца','c-yellow',rep?'готов':'в конце месяца',report)+
    pn('s12','Операции','c-pink',tx.length+' шт.'+(F_&&F_.source?' · '+esc(F_.source):''),'<div class="list">'+list+'</div>'+(tx.length>40?'<div class="muted" style="font-size:16px">Показаны последние 40</div>':''))+
    savings+'</div>';
};

V.move=function(){

  var gs=['Язык','Деньги','Документы','Виза'];
  return cover('Главный квест','Переезд в США','Шаги по визе, документам, деньгам и языку с дедлайнами.',[[done+'/'+L.length,'шагов готово'],[pctOf(done,L.length)+'%','глава 1']])+
  '<div class="grid">'+gs.map(function(g){return pn('s6',g,'c-yellow',null,'<div class="list">'+L.map(function(x,i){if(x.g!==g)return '';return '<div class="task'+(x.done?' done':'')+'"><button class="ck'+(x.done?' on':'')+'" data-a="moveDone" data-i="'+i+'" aria-label="Готово"></button><span class="t">'+esc(x.t)+'</span><span class="tag c-'+(daysTo(x.d)<30&&!x.done?'pink':'cyan')+'">'+fmtDate(x.d)+'</span>'+edb('move',i)+'</div>';}).join('')+'</div>');}).join('')+
  pn('s12','Новый шаг','c-cyan',null,'<form class="row" data-f="addMove"><input class="inp" id="mn" placeholder="Что сделать" required><select class="inp" id="mg">'+gs.map(function(g){return '<option>'+g+'</option>';}).join('')+'</select><input class="inp" id="md" type="date" required style="flex:none"><button class="btn b-cyan">Добавить</button></form>')+'</div>';
};
function rng(kind,i,v,c){return '<input class="rng" type="range" min="0" max="100" step="5" value="'+v+'" data-r="'+kind+'" data-i="'+i+'" style="--v:'+v+'%;--c:'+c+'" aria-label="Прогресс, %">';}
V.piano=function(){
  var P=S.piano;var week=0;var bars='';
  var mx=60;for(var i=0;i<7;i++)mx=Math.max(mx,P.log[iso(addDays(MON,i))]||0);
  for(var i=0;i<7;i++){var s=iso(addDays(MON,i));var m=P.log[s]||0;week+=m;bars+='<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;flex:1;min-width:0;height:100%"><span style="font-size:15px">'+m+'</span><div style="width:100%;max-width:40px;height:'+(m?Math.max(4,Math.round(m/mx*120)):2)+'px;background:'+(s===TD?'var(--yellow)':'var(--orange)')+'"></div><span class="muted" style="font-size:15px">'+DOW[addDays(MON,i).getDay()]+'</span></div>';}
  var ptabs='<div class="grid"><div class="s12 tabs">'+[['practice','Практика'],['solf','Сольфеджио']].map(function(t){return '<button class="tab'+((S.ptab||'practice')===t[0]?' on':'')+'" data-a="ptab" data-t="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div></div>';
  if(S.ptab==='solf')return cover('Практика','Фортепиано','Минуты практики каждый день и пьесы, которые разучиваешь.',[[week+' мин','за неделю'],[(P.log[TD]||0)+' мин','сегодня'],['LVL '+statLvl('dex'),'Ловкость']])+ptabs+'<div class="grid">'+solfView()+'</div>';
  return cover('Практика','Фортепиано','Минуты практики каждый день и пьесы, которые разучиваешь.',[[week+' мин','за неделю'],[(P.log[TD]||0)+' мин','сегодня'],['LVL '+statLvl('dex'),'Ловкость']])+ptabs+
  '<div class="grid">'+pn('s7','Минуты за неделю','c-orange',null,'<div style="display:flex;align-items:flex-end;gap:8px;height:180px;overflow:hidden">'+bars+'</div><div class="muted" style="font-size:16px">Занятие по фортепиано из расписания (60 минут) записывается само, когда отмечаешь его в плане дня.</div><form class="row" data-f="addPiano"><input class="inp" id="pm" type="number" min="1" max="240" placeholder="Сколько минут сегодня" required><button class="btn b-orange">Записать +XP</button></form>')+
  pn('s5','Разучиваю','c-yellow','двигай ползунок',
    '<div class="list">'+P.pieces.map(function(x,i){return '<div class="prog"><div class="row" style="gap:8px"><input class="inp ghost" value="'+esc(x.t)+'" data-r="pieceT" data-i="'+i+'" aria-label="Название пьесы"><b class="pv" id="pv-piece-'+i+'">'+x.p+'%</b><button class="mini" data-a="delPiece" data-i="'+i+'" aria-label="Удалить">✕</button></div>'+rng('piece',i,x.p,'var(--yellow)')+'</div>';}).join('')+'</div>'+
    '<form class="row" data-f="addPiece"><input class="inp" id="pc" placeholder="Новая пьеса или упражнение" required><button class="btn b-orange">+</button></form>')+'</div>';
};

function bookCover(t,i,img,w){
  w=w||72;var h=Math.round(w*1.45);
  if(img)return '<img class="bcover" src="'+esc(img)+'" alt="Обложка: '+esc(t)+'" style="width:'+w+'px;height:'+h+'px">';
  var r=RECS.filter(function(x){return x.t===t;})[0]||{c1:['#FF5FA2','#4FD1E8','#FFD166','#B58CFF','#7BE08A','#FF9F43'][i%6],c2:'#271E57'};
  return '<div class="bcover px" aria-hidden="true" style="width:'+w+'px;height:'+h+'px;--c1:'+r.c1+';--c2:'+r.c2+'"><span>'+esc(String(t).replace(/[«»]/g,'').split(',')[0])+'</span></div>';
}

  pn('s6','Пройдено','c-violet',G.done.length+' игр',gl(G.done,'done')+gform('done','Какую игру прошёл'))+
  '</div>';

    K.f.forEach(function(x){var el=document.getElementById('ed_'+x[0]),t=x[2]||'text';if(t==='days'){v[x[0]]=[].map.call(el.querySelectorAll('.b-cyan'),function(b){return +b.dataset.day;});}else if(t==='num'||x[4]){v[x[0]]=+el.value||0;}else v[x[0]]=el.value.trim();});
    if(K.f[0]&&!v[K.f[0][0]]&&v[K.f[0][0]]!==0){toast('Заполни «'+K.f[0][1]+'»');return;}
    if(K.put)K.put(i,v);else{for(var key in v){if(key==='days'&&!v.days.length)delete o.days;else o[key]=v[key];}}
    if(K.after)K.after(o,old);checkDay();save();render();closeEd();toast('Сохранено');});
  document.getElementById('gedit').addEventListener('click',function(e){if(e.target.id==='gedit')closeEd();});
})();
/* ---------- долгое нажатие: правка и перенос дел ---------- */
var PART_TM={'Утро':'09:00','День':'13:00','Вечер':'19:00'};
function tmDiff(a,b){var p=a.split(':'),q=b.split(':');return (+q[0]*60+ +q[1])-(+p[0]*60+ +p[1]);}
function moveTo(id,g,bef){var t=task(id);if(!t)return;var same=whenOf(t)===g;
  if(!same){t.when=g;if(t.tm){var dur=t.end?tmDiff(t.tm,t.end):0;t.tm=PART_TM[g];t.end=dur>0?tmAdd(t.tm,dur):'';}}
  var list=S.tasks.filter(function(x){return x.date===t.date&&x!==t&&whenOf(x)===g;}).sort(taskSort);var pos=-1;if(bef)for(var k=0;k<list.length;k++)if(list[k].id===bef)pos=k;if(pos<0)pos=list.length;list.splice(pos,0,t);list.forEach(function(x,k){x.ord=k;});
  save();render();toast(same?'Порядок изменён':'Перенесено: '+g.toLowerCase()+(t.tm?', '+t.tm:''));}
function openEdit(id){var t=task(id);if(!t)return;var f=document.getElementById('teForm');var part=whenOf(t);
  f.innerHTML='<h3>Изменить дело</h3>'+(t.rec&&byId(S.sched,t.rec)?'<div class="muted" style="font-size:16px">Это дело из расписания: здесь меняется только этот день. <button type="button" class="mini" id="teSched">Изменить во всём расписании</button></div>':'')+
  '<label for="teT">Название</label><input class="inp" id="teT" value="'+esc(t.t)+'" required>'+
  '<label>Когда</label><div class="seg">'+['Утро','День','Вечер'].map(function(g){return '<button type="button" class="btn '+(g===part?'b-cyan':'b-ghost')+'" data-part="'+g+'">'+g+'</button>';}).join('')+'</div>'+
  '<div class="row"><div style="flex:1 1 120px"><label for="teTm">Начало</label><input class="inp" type="time" id="teTm" value="'+(t.tm||'')+'"></div><div style="flex:1 1 120px"><label for="teEn">Конец</label><input class="inp" type="time" id="teEn" value="'+(t.end||'')+'"></div></div>'+
  '<label for="teD">День</label><input class="inp" type="date" id="teD" value="'+t.date+'">'+(t.rec?'':'<label for="teR">Повтор</label><select class="inp" id="teR"><option value="">Не повторять</option><option value="all">Каждый день</option><option value="wd">По будням</option><option value="we">По выходным</option><option value="w1">Раз в неделю, в этот день</option></select>')+
  '<div class="row" style="justify-content:space-between"><button type="button" class="btn b-pink" id="teDel">Удалить</button><span class="row" style="gap:8px"><button type="button" class="btn b-ghost" id="teNo">Отмена</button><button class="btn b-cyan">Сохранить</button></span></div>';
  f.dataset.id=id;f.dataset.when=part;document.getElementById('tedit').hidden=false;}
function closeEdit(){document.getElementById('tedit').hidden=true;}
(function(){var f=document.getElementById('teForm');
  f.addEventListener('click',function(e){var b=e.target.closest('[data-part]');if(b){var g=b.dataset.part;f.dataset.when=g;f.querySelectorAll('[data-part]').forEach(function(x){x.className='btn '+(x===b?'b-cyan':'b-ghost');});var tm=document.getElementById('teTm'),en=document.getElementById('teEn');if(tm.value){var dur=en.value?tmDiff(tm.value,en.value):0;tm.value=PART_TM[g];en.value=dur>0?tmAdd(tm.value,dur):'';}return;}
    if(e.target.id==='teNo'){closeEdit();return;}
    if(e.target.id==='teSched'){var tt=task(f.dataset.id);closeEdit();if(tt)openEd('sched',tt.rec);return;}
    if(e.target.id==='teDel'){var t=task(f.dataset.id);if(t){snap();if(t.main)S.start.main='';S.tasks=S.tasks.filter(function(x){return x!==t;});save();render();undoToast('Дело удалено');}closeEdit();}});
  f.addEventListener('submit',function(e){e.preventDefault();var t=task(f.dataset.id);if(!t){closeEdit();return;}var v=document.getElementById('teT').value.trim();if(!v)return;
    if(t.main)S.start.main=v;t.t=v;t.tm=document.getElementById('teTm').value||'';t.end=t.tm?document.getElementById('teEn').value||'':'';t.when=f.dataset.when;var nd=document.getElementById('teD').value;if(nd&&nd!==t.date){t.date=nd;if(nd!==TD)t.main=false;}
    var rr=document.getElementById('teR');if(rr&&rr.value){var dw=new Date(t.date+'T12:00:00').getDay();var dows={all:[1,2,3,4,5,6,0],wd:[1,2,3,4,5],we:[6,0],w1:[dw]}[rr.value];if(!t.tm)t.tm=PART_TM[t.when]||'13:00';var x={id:'s'+uid(),dows:dows,dow:dows[0],tm:t.tm,end:t.end||'',t:t.t,stat:t.stat||'end',xp:t.xp||15};S.sched.push(x);regenSched(x);S.tasks=S.tasks.filter(function(z){return !(z.rec===x.id&&z.date===t.date);});t.rec=x.id;toast('Повтор добавлен в расписание');}
    save();render();closeEdit();toast('Сохранено');});
  document.getElementById('tedit').addEventListener('click',function(e){if(e.target.id==='tedit')closeEdit();});
})();
var LP={id:null,on:false,fired:false,drag:null,touchAt:0};
function lpStart(x,y,target){if(!target.closest||target.closest('input,select,textarea'))return;var row=target.closest('.task[data-tid]');if(!row)return;
  LP.id=row.dataset.tid;LP.row=row;LP.x=x;LP.y=y;LP.on=false;LP.fired=false;clearTimeout(LP.t);
  LP.t=setTimeout(function(){LP.on=true;LP.fired=true;row.classList.add('held');try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}},450);}
function lpMove(x,y,ev){if(!LP.id)return;
  if(!LP.on){if(Math.abs(x-LP.x)>10||Math.abs(y-LP.y)>10){clearTimeout(LP.t);LP.id=null;}return;}
  if(ev.cancelable)ev.preventDefault();
  if(!LP.drag&&document.querySelector('.dgrp')&&(Math.abs(x-LP.x)>6||Math.abs(y-LP.y)>6)){var r=LP.row.getBoundingClientRect();var g=LP.row.cloneNode(true);g.classList.add('ghost-drag');g.classList.remove('held');g.style.width=r.width+'px';g.style.left=r.left+'px';document.body.appendChild(g);LP.drag=g;LP.dy=LP.y-r.top;LP.row.style.opacity='.3';}
  if(LP.drag){LP.drag.style.top=(y-LP.dy)+'px';var el=document.elementFromPoint(x,y);var d=el&&el.closest?el.closest('.dgrp'):null;
    document.querySelectorAll('.dgrp.over').forEach(function(z){if(z!==d)z.classList.remove('over');});if(d)d.classList.add('over');LP.over=d;
    var rows=d?[].filter.call(d.querySelectorAll('.task[data-tid]'),function(r){return r!==LP.row;}):[];var bef=null;for(var k=0;k<rows.length;k++){var rr=rows[k].getBoundingClientRect();if(y<rr.top+rr.height/2){bef=rows[k];break;}}
    document.querySelectorAll('.task.ins,.dgrp.ins-end').forEach(function(z){z.classList.remove('ins');z.classList.remove('ins-end');});if(bef)bef.classList.add('ins');else if(d)d.classList.add('ins-end');LP.bef=bef?bef.dataset.tid:null;
    if(y<90)window.scrollBy(0,-14);else if(y>window.innerHeight-130)window.scrollBy(0,14);}}
function lpEnd(){clearTimeout(LP.t);if(!LP.id)return;var id=LP.id,row=LP.row;LP.id=null;if(!LP.on)return;LP.on=false;setTimeout(function(){LP.fired=false;},350);row.classList.remove('held');
  if(LP.drag){LP.drag.remove();LP.drag=null;row.style.opacity='';var d=LP.over;LP.over=null;document.querySelectorAll('.dgrp.over').forEach(function(z){z.classList.remove('over');});document.querySelectorAll('.task.ins,.dgrp.ins-end').forEach(function(z){z.classList.remove('ins');z.classList.remove('ins-end');});if(d)moveTo(id,d.dataset.g,LP.bef);}
  else openEdit(id);}
document.addEventListener('touchstart',function(e){LP.touchAt=Date.now();if(e.touches.length===1)lpStart(e.touches[0].clientX,e.touches[0].clientY,e.target);},{passive:true});
document.addEventListener('touchmove',function(e){if(e.touches.length)lpMove(e.touches[0].clientX,e.touches[0].clientY,e);},{passive:false});
document.addEventListener('touchend',function(){LP.touchAt=Date.now();lpEnd();});
document.addEventListener('touchcancel',function(){LP.touchAt=Date.now();lpEnd();});
document.addEventListener('mousedown',function(e){if(e.button!==0||Date.now()-LP.touchAt<900)return;lpStart(e.clientX,e.clientY,e.target);});
document.addEventListener('mousemove',function(e){if(Date.now()-LP.touchAt<900)return;lpMove(e.clientX,e.clientY,e);});
document.addEventListener('mouseup',function(){if(Date.now()-LP.touchAt<900)return;lpEnd();});
document.addEventListener('click',function(e){if(LP.fired){LP.fired=false;e.stopPropagation();e.preventDefault();}},true);
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('.task[data-tid]'))e.preventDefault();});
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');
  if(!el)return;
  var fn=A[el.dataset.a];if(!fn)return;
  ev.preventDefault();var isDel=/^del/.test(el.dataset.a);if(isDel)snap();
  var res=fn(el);if(res!=='norender')checkDay();save();
  if(res!=='norender')render();if(isDel)undoToast('Удалено');
});
document.addEventListener('submit',function(ev){
  var f=ev.target;var fn=F[f.dataset.f];if(!fn)return;ev.preventDefault();
  var res=fn(f);if(res!=='norender')checkDay();save();if(res!=='norender')render();
});
function setPath(p,v){var ks=p.split('.'),o=S;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];if(o)o[ks[ks.length-1]]=v;}
document.addEventListener('input',function(ev){var el=ev.target;if(el.dataset&&el.dataset.p){var v=el.dataset.num?(+el.value||0):el.value;setPath(el.dataset.p,v);if(el.type==='range'){el.style.setProperty('--v',v+'%');var lb=document.getElementById('pv-'+el.dataset.p);if(lb)lb.textContent=v+'%';}return;}
  if(!el.dataset||!el.dataset.r)return;var i=+el.dataset.i,k=el.dataset.r;
  if(k==='pieceT'){if(S.piano.pieces[i])S.piano.pieces[i].t=el.value;return;}
  var o=k==='book'?S.books.now[i]:S.piano.pieces[i];if(!o)return;o.p=+el.value;el.style.setProperty('--v',o.p+'%');var lb=document.getElementById('pv-'+k+'-'+i);if(lb)lb.textContent=o.p+'%';});
document.addEventListener('change',function(ev){var el=ev.target;
  if(el.dataset&&el.dataset.p){if(el.dataset.p==='stars.rate'&&S.stars.rate<1)S.stars.rate=1;save();render();return;}
  if(el.dataset&&el.dataset.r){save();if(el.dataset.r==='book'&&+el.value===100)toast('100%! Нажми «Дочитал», чтобы получить XP');return;}
  if(el.dataset&&el.dataset.up==='restore'&&el.files&&el.files[0]){var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(!(d.state&&d.state.tasks)&&d.finance&&typeof d.finance==='object'){Object.keys(d.finance).forEach(function(k){FIN[k]=d.finance[k];if(USER)kvPut('finance:'+k,d.finance[k]);});FINM=null;render();toast('Финансы загружены');return;}if(!d.state||!d.state.tasks)throw 0;S=d.state;migrate();dayReset();if(d.finance&&typeof d.finance==='object'){FIN=d.finance;if(USER)Object.keys(d.finance).forEach(function(k){kvPut('finance:'+k,d.finance[k]);});}save();render();toast('Данные восстановлены из копии');}catch(er){toast('Это не файл копии кабинета');}};fr.readAsText(el.files[0]);return;}
  if(el.dataset&&el.dataset.up==='book'&&el.files&&el.files[0]&&ASSETS){var i=+el.dataset.i;toast('Загружаю обложку…');ASSETS.upload(el.files[0]).then(function(a){if(S.books.now[i]){S.books.now[i].img=a.url;save();render();toast('Обложка добавлена');}},function(){toast('Не удалось загрузить обложку');});}
});
document.getElementById('meBtn').addEventListener('click',function(){location.hash='hero';});
var mb=document.getElementById('moreBtn'),mm=document.getElementById('moreMenu');
mb.addEventListener('click',function(e){e.stopPropagation();mm.hidden=!mm.hidden;mb.setAttribute('aria-expanded',String(!mm.hidden));});
document.addEventListener('click',function(e){if(!mm.hidden&&!mm.contains(e.target)&&e.target!==mb){mm.hidden=true;mb.setAttribute('aria-expanded','false');}});
document.getElementById('sheet').addEventListener('click',function(e){if(e.target.id==='sheet'||e.target.closest('a'))document.getElementById('sheet').hidden=true;});
window.addEventListener('hashchange',function(){mm.hidden=true;render();window.scrollTo(0,0);});
render();initCloud();
})();
